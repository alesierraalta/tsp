name: testing gate

# The gate TSP ships for other repositories, run on TSP itself: a pull request that changes
# production source without a test that fails on the code the range started from fails here.
on:
  pull_request:
  # A queued batch is checked before it merges, like any other range: the gate must answer for the
  # commits the queue holds, not only for a pull request's own head.
  merge_group:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # --base reads the range, so the base branch has to be in the clone.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The gate is built from the pull request itself. A change that weakens `check` would weaken
      # its own verdict, which is why the exit code is reported and, in a repository that runs the
      # released binary instead, replaced by it.
      - run: go build -o "$RUNNER_TEMP/tsp" ./cmd/tsp
      # The check runs each changed test on its own, and a Python test is run through pytest; without it
      # the gate cannot judge a Python test and fails closed, which is right but says nothing about the test.
      - run: python3 -m pip install --quiet pytest
      # A pull request is checked against its base branch; a queued batch against the commit the queue
      # started from, which is not a branch and has no ref to fetch. Resolving it here keeps one command
      # for both events instead of a second copy of the check.
      - name: base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "ref=${{ github.event.merge_group.base_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          fi
      - run: '"$RUNNER_TEMP/tsp" check --base "${{ steps.base.outputs.ref }}"'
