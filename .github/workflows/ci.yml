name: CI

# The suite the commit carries, not the one the worktree had. #107 shipped without a guard its own
# tests assert: the branch was green, master went red, and nothing ran the tests on what was pushed.
# This job runs them there.
on:
  push:
    branches: [main]
  pull_request:
  # The merge queue builds the batch it is about to merge: the same checks, on the range that will land
  # instead of on a branch that has fallen behind. Without this trigger a queued pull request has no
  # check to report and the queue stalls.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The bench drives `node --test` for the JavaScript corpus. Without node those tests skip, and a
      # silent skip is a green run that verified less than it claims.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: build
        run: make build
      # The corpus fixture check runs the suite of every corpus case on every fix variant: ~95 s of a ~195 s round,
      # on work that only changes when the corpus or the code that runs its suites does. It runs in corpus.yml
      # when those paths change instead of in every round (#435). Every other test runs here as before.
      - name: test
        run: go test ./... -count=1 -skip '^TestCorpusSuitesAreGreenOnEveryVariant$'
      # The testing gate does not read the plan for a commit range, so two branches cut from the same main that
      # each record the next free id would merge into one plan holding that id twice. On a pull request this runs
      # on the merge with main; on main it runs on what was merged.
      - name: plan check
        run: ./bin/tsp plan check --path docs/testing/test-plan.md
      # The measure-change skill's shell runner is unreachable from go test. It skips on a branch
      # that does not carry the skill, so this step never turns an unrelated branch red.
      - name: skill selftest
        run: make skill-selftest
      # The Pi extension's pure surface (dispatch, detection, observation, UI guarding) is a .mjs
      # suite over a .ts module; go test never reaches it, so a silent skip here would be a green
      # run that verified less than it claims.
      - name: test pi extension
        run: node --test assets/hosts/pi/tsp.test.mjs
