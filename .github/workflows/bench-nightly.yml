name: bench

# The bench measures an agent, so it uses the same agent this project runs locally: pi.
# No vendor API key is invented here: pi carries its own credentials, and this workflow either
# has a pi home to restore or says out loud that it measured nothing. A scheduled job that
# reports green without measuring is worse than a job that never ran.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      max-cost-usd:
        description: 'Spend ceiling for this run, in USD'
        default: '1.50'
        required: false

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pi
        run: npm install --global @earendil-works/pi-coding-agent
      - name: Restore the pi home
        id: home
        env:
          PI_HOME_B64: ${{ secrets.TSP_PI_HOME_B64 }}
        run: |
          if [ -z "$PI_HOME_B64" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no TSP_PI_HOME_B64 secret: pi is not authenticated here,"
            echo "::notice::so the bench measured nothing. Export your own pi home with:"
            echo '::notice::tar czf - -C "$HOME" .pi/agent | base64 -w0'
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          mkdir -p "$HOME"
          printf '%s' "$PI_HOME_B64" | base64 -d | tar xzf - -C "$HOME"
      - name: Run the bench with pi
        if: steps.home.outputs.present == 'true'
        env:
          BUDGET: ${{ github.event.inputs.max-cost-usd || '1.50' }}
          MODEL: ${{ vars.TSP_BENCH_MODEL || 'openai-codex/gpt-6-luna' }}
        run: |
          make build
          ./bin/tsp bench run \
            -cases 'bench/cases/h*' \
            -runs 1 \
            -runner pi \
            -model "$MODEL" \
            -agent-config bench \
            -max-cost-usd "$BUDGET" \
            -bench-dir bench-results
      - name: Refuse a run that lost recall
        if: steps.home.outputs.present == 'true'
        env:
          FLOOR: ${{ vars.TSP_BENCH_MIN_RECALL || '0.60' }}
        run: |
          run=$(find bench-results/results -mindepth 1 -maxdepth 1 -type d | sort | tail -1)
          if [ -f bench/baseline/aggregate.json ]; then
            ./bin/tsp bench gate --baseline bench/baseline \
              --min-recall "$FLOOR" --max-regression 0.05 "$run"
          else
            echo "::notice::no recorded baseline: recall floor $FLOOR only"
            ./bin/tsp bench gate --min-recall "$FLOOR" "$run"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.home.outputs.present == 'true'
        with:
          name: bench-results
          path: bench-results
          retention-days: 30
